name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to run the smoke suite against (defaults to production)."
        required: false

# Cancel any in-flight run for the same PR when a new commit lands —
# no point burning CI minutes on stale code, and the newer run's
# result is the one that actually gates merge.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The server's own smoke tests (src/lib/__tests__/*.smoke.ts): the
  # permission catalog, ringing, groups, reports and the rest, against the
  # in-memory stores. No browser and no network, so they need nothing but
  # the dependencies, and run in seconds.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server smoke tests
        run: npm run test:smoke

  # The Flutter app's own tests (mobile/test) and its analyzer. Info-level
  # findings are reported but don't fail the job; warnings and errors do.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # The version the suite passes on locally; bump together.
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        # Chromium only — this suite runs in one project (see
        # playwright.config.ts) so pulling all browsers would waste
        # ~200 MB of cache per run.
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        env:
          # Prefer an explicit input, then a repo variable, else prod.
          # Prod is a safe default because the whole suite is read-only.
          PLAYWRIGHT_BASE_URL: >-
            ${{
              github.event.inputs.base_url
              || vars.PLAYWRIGHT_BASE_URL
              || 'https://www.neoconference.app'
            }}
          CI: "1"
        # @postdeploy specs assert things about a deployment, not about the
        # code in this branch — whether the live alias serves what was
        # merged. This suite runs against production, so on the PR that
        # first adds such an endpoint they fail for the one reason changing
        # the branch cannot fix: it is not live yet. They run after
        # promoting, via `npm run test:postdeploy`.
        run: npx playwright test --grep-invert "@postdeploy"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
